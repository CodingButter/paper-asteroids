<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Paper Asteroids</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas { display: block; margin: 0 auto; image-rendering: auto; }

      /* Touch controls: hidden until a coarse pointer shows up (see core/touch.ts). */
      #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      body.touch #touch { display: block; }
      /* Rounded triangle, apex up. Knob rests at the bottom centre (see KNOB_INSET in core/touch.ts):
         slide left/right to turn, push toward the apex to thrust. */
      #touch .stick {
        position: absolute; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
        width: 176px; height: 164px; pointer-events: auto; touch-action: none;
        --pad-fill: rgba(243, 240, 232, 0.18); --pad-edge: rgba(243, 240, 232, 0.55);
      }
      #touch .stick svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #touch .stick path { fill: var(--pad-fill); stroke: var(--pad-edge); stroke-width: 2; }
      #touch .stick.active { --pad-fill: rgba(243, 240, 232, 0.28); }
      #touch .stick.thrust { --pad-fill: rgba(255, 59, 48, 0.3); --pad-edge: #ff3b30; filter: drop-shadow(0 0 12px rgba(255, 59, 48, 0.5)); }
      #touch .knob {
        position: absolute; left: 50%; bottom: 36px; width: 52px; height: 52px; margin: 0 0 -26px -26px; border-radius: 50%;
        background: #f3f0e8; box-shadow: 4px 5px 6px rgba(0,0,0,0.6);
      }
      #touch .pause {
        position: absolute; right: max(16px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
        width: 44px; height: 44px; border: 0; border-radius: 6px; font: bold 18px system-ui, sans-serif;
        background: rgba(243, 240, 232, 0.85); color: #000; pointer-events: auto; touch-action: none;
      }

      /* Phones in portrait get a tiny letterboxed stage; ask for landscape. */
      #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000; color: #f3f0e8;
        font: 22px Georgia, serif; text-align: center; padding: 40vh 24px 0; box-sizing: border-box; }
      @media (pointer: coarse) and (orientation: portrait) and (max-width: 600px) { #rotate { display: block; } }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate">Turn your phone sideways to play.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

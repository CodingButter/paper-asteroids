<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Paper Asteroids share artwork</title>
<style>
@font-face{font-family:Ransom;src:url('/fonts/Ransom.ttf')}
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;overflow:hidden;background:#171715 url('/img/background.jpg') center/1200px;color:#1a1a1a}
.rock{position:absolute;width:290px;right:-90px;top:-85px;transform:rotate(20deg)}
.planet{position:absolute;width:300px;left:-115px;bottom:-120px}
.sheet{position:absolute;inset:55px 100px 55px 85px;background:#f3f0e8;transform:rotate(-1deg);padding:38px 48px;box-shadow:12px 16px 0 #0008;clip-path:polygon(0 1%,8% 0,17% 1%,30% 0,45% 1%,59% 0,75% 1%,89% 0,100% 1%,99% 35%,100% 65%,99% 99%,85% 100%,70% 99%,55% 100%,40% 99%,25% 100%,10% 99%,0 100%)}
.tape{position:absolute;top:38px;left:470px;width:180px;height:42px;background:#c5ba9dcc;transform:rotate(5deg)}
.eyebrow{font:700 23px Arial,sans-serif;letter-spacing:3px;color:#93251d;margin:0 0 18px}
h1{font:normal 88px/.95 Ransom,Impact,sans-serif;margin:0;width:780px}h1 span{display:block;font-size:57px;margin-bottom:7px}
.story{font:32px/1.35 Georgia,serif;margin:25px 0 0;max-width:680px}
.signature{font:italic 30px Georgia,serif;margin:22px 0 0;color:#93251d}
.ship{position:absolute;width:190px;right:18px;bottom:53px;transform:rotate(8deg);filter:drop-shadow(8px 10px 5px #0007)}
</style>
<img class="rock" src="/img/asteroid1.png" alt="" />
<img class="planet" src="/img/asteroid3.png" alt="" />
<main class="sheet">
<p class="eyebrow">A FATHER. A SON. A LOT OF PAPER.</p>
<h1><span>PAPER</span>ASTEROIDS</h1>
<p class="story">A game we made together.<br>A thank-you, seventeen years later.</p>
<p class="signature">For Dad. With love, Jamie.</p>
</main>
<div class="tape"></div>
<img class="ship" src="/img/ship.png" alt="Paper rocket" />
</html>
